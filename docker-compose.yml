services:
  db:
    image: postgis/postgis:16-3.4
    container_name: faro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faro}
      POSTGRES_USER: ${POSTGRES_USER:-faro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faro}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faro} -d ${POSTGRES_DB:-faro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faro-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-faro}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-faro}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-faro}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
          API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_data:
