services:
  db:
    image: postgis/postgis:16-3.4
    container_name: faro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faro}
      POSTGRES_USER: ${POSTGRES_USER:-faro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faro}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faro} -d ${POSTGRES_DB:-faro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faro-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-faro}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-faro}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-faro}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TZ: America/Argentina/Buenos_Aires
      # Clave de las sesiones (obligatoria: sin ella el backend no arranca). Sale del archivo .env
      FARO_JWT_SECRET: ${FARO_JWT_SECRET:-}
      # Almacén de fotos: el servicio rustfs de acá abajo. Las claves salen del archivo .env (no se sube a GitHub)
      # s3 = el servicio rustfs de abajo (hace falta FARO_S3_* en .env) · memoria = sin depósito, las fotos se pierden al reiniciar
      FARO_ALMACEN: ${FARO_ALMACEN:-s3}
      FARO_S3_ENDPOINT: http://rustfs:9000
      FARO_S3_BUCKET: faro-fotos
      FARO_S3_ACCESS_KEY: ${FARO_S3_ACCESS_KEY:-}
      FARO_S3_SECRET_KEY: ${FARO_S3_SECRET_KEY:-}
    ports:
      - "8080:8080"

  # Almacén de fotos de las OT (estándar S3, como Backblaze B2 o Cloudflare R2 en la nube).
  # Es RustFS porque MinIO dejó de publicar imágenes de Docker.
  # Necesita dos líneas en el archivo .env de la raíz (cada uno escribe las suyas; .env no se sube a GitHub):
  #   FARO_S3_ACCESS_KEY=<un nombre de usuario>   y   FARO_S3_SECRET_KEY=<una clave de 8 caracteres o más>
  # Sin ese archivo, este servicio se detiene y el resto de FARO funciona igual (sin fotos).
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: faro-rustfs
    restart: on-failure:3
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${FARO_S3_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${FARO_S3_SECRET_KEY:-}
    ports:
      - "127.0.0.1:9000:9000" # API S3 (la usa el backend)
      - "127.0.0.1:9001:9001" # consola web para mirar las fotos guardadas
    volumes:
      - fotos_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
          API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  # Para probar FARO SIN CONEXIÓN (PWA): la versión compilada, con service worker, en http://localhost:4173.
  # El servidor de desarrollo (frontend, puerto 5173) no registra service worker a propósito, así que sin red
  # muestra el dinosaurio de Chrome. Se levanta aparte y no pisa al de desarrollo:
  #   docker compose --profile pwa up --build frontend-pwa
  # Cada cambio de código requiere volver a correr ese comando (compila de nuevo).
  frontend-pwa:
    profiles: ["pwa"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faro-frontend-pwa
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "4173:4173"
    command: npm run pwa

volumes:
  db_data:
  fotos_data:
