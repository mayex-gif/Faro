spring.application.name=backend

# Puerto donde atiende el backend.
# En la compu y en Docker es 8080. En Render, la nube nos dice el puerto en la variable PORT.
server.port=${PORT:8080}

# Conexión a la base de datos PostgreSQL local.
# En Docker y en Render estos valores se reemplazan con las variables
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/faro

spring.datasource.username=faro
spring.datasource.password=faro

# Comportamiento de Hibernate (igual al que tienen en Docker)
spring.jpa.hibernate.ddl-auto=update

# Páginas web que pueden llamar a la API (CORS), separadas por comas.
# En la compu es el frontend de Vite; en Render se cambia con la variable FARO_CORS_ORIGENES.
faro.cors.origenes=${FARO_CORS_ORIGENES:http://localhost:5173}

# JWT - Clave secreta (mínimo 256 bits para HS256) y duración del token (24 horas = 86400000 ms)
faro.jwt.secret=${FARO_JWT_SECRET}
faro.jwt.expiration-ms=${FARO_JWT_EXPIRATION_MS:86400000}

# Clave inicial para precarga de usuarios del municipio (configurable por entorno)
faro.usuarios.clave-inicial=${FARO_DEFAULT_PASSWORD:Faro2026!}

# Motor de Mantenimiento Periódico (CRON diario por defecto a las 06:00 hs)
faro.mantenimiento.cron=${FARO_MANTENIMIENTO_CRON:0 0 6 * * *}
faro.mantenimiento.scheduler.enabled=${FARO_MANTENIMIENTO_SCHEDULER_ENABLED:true}

# Almacén de fotos de las OT (estándar S3). Las fotos son privadas: se ven solo a través del backend.
# En la compu es RustFS (servicio "rustfs" de docker-compose); en Render, Backblaze B2 o Cloudflare R2.
# Las claves NO van acá: se cargan con las variables FARO_S3_ACCESS_KEY y FARO_S3_SECRET_KEY.
# Sin claves el backend arranca igual y los pedidos con fotos responden 503.
faro.s3.endpoint=${FARO_S3_ENDPOINT:http://localhost:9000}
faro.s3.region=${FARO_S3_REGION:us-east-1}
faro.s3.bucket=${FARO_S3_BUCKET:faro-fotos}
faro.s3.access-key=${FARO_S3_ACCESS_KEY:}
faro.s3.secret-key=${FARO_S3_SECRET_KEY:}
faro.s3.path-style=${FARO_S3_PATH_STYLE:true}

# Fotos de los comentarios: hasta 3 MB cada una y 16 MB por envío (5 fotos + el texto).
# Si se pasa, responde 413. max-swallow-size: Tomcat lee el pedido entero antes de responder el 413
# (si no, corta la conexión y el celular ve "sin red" en vez del aviso).
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=16MB
server.tomcat.max-swallow-size=20MB
